packages:
  - "apps/*"
  - "packages/*"
  - "e2e"
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Phase 20 production-readiness audit: real Trivy HIGH/CRITICAL findings
# with available fixes, in transitive deps (not our direct dependencies)
# -- pinned to the minimum patched version per major line found in the
# tree, not collapsed to one version, so unrelated consumers pinning
# different majors aren't forced to jump.
overrides:
  tar: "7.5.21"
  brace-expansion@1: "1.1.18"
  brace-expansion@2: "2.1.4"
  brace-expansion@3: "3.0.6"
  brace-expansion@5: "5.0.9"
  ip-address: "10.3.1"
  postcss: "8.5.18"
  sharp: "0.35.0"
  undici: "6.27.0"
